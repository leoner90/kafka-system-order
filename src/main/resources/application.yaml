#BASE
spring:
  application:
    name: order-service
  config:
    import: "file:.env[.properties]"

  #DB SETUP
  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:mysql://localhost:3306/orders_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  #KAFKA
  kafka:
    bootstrap-servers: localhost:9092
    #    consumer:
    #      group-id: order-service
    #      auto-offset-reset: earliest # // starts reading from the oldest available msg
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

      properties:
        spring.json.add.type.headers: false # Prevent Java class metadata in Kafka headers; consumers use their own event classes.

#Server port
server:
  port: 8080

